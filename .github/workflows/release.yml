name: Release and Deploy Pages

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: 'latest'

      - name: Build WebAssembly package
        run: wasm-pack build --target web --release

      - name: Generate physical demo archive
        run: cargo run --bin make_tre

      - name: Package release archives
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tar -czf swg-tre-wasm-web.tar.gz pkg/ assets/
          zip -r swg-tre-wasm-web.zip pkg/ assets/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            swg-tre-wasm-web.tar.gz
            swg-tre-wasm-web.zip
            pkg/swg_tre_wasm_bg.wasm
            assets/demo_archive.tre
          generate_release_notes: true

      - name: Setup Node for GitHub Packages
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@${{ github.repository_owner }}'

      - name: Publish to GitHub Packages
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          npm pkg set name="@${{ github.repository_owner }}/swg-tre-wasm" --prefix pkg
          npm pkg set publishConfig.registry="https://npm.pkg.github.com" --prefix pkg
          npm publish ./pkg
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare site directory for GitHub Pages
        if: startsWith(github.ref, 'refs/heads/') || github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p _site
          cp index.html index.css app.js _site/
          cp -r pkg _site/
          cp -r assets _site/
          if [ -f "tatooine_dune_01.dds" ]; then cp tatooine_dune_01.dds _site/; fi

      - name: Upload GitHub Pages artifact
        if: startsWith(github.ref, 'refs/heads/') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy-pages:
    needs: build-and-package
    if: startsWith(github.ref, 'refs/heads/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
