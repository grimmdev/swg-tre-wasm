[package]
name = "swg_tre"
version = "0.1.0"
edition = "2021"
description = "A library for reading from and creating TRE files used by Star Wars Galaxies (WASM compatible)"
license = "AGPL-3.0-or-later"

[dependencies]
binrw = "0.14"
bon = "2.3"
byteorder = "1"
crc = "3.2"
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }
indexmap = "2.6"
md-5 = "0.10"
thiserror = "1.0"
tracing = { version = "0.1", default-features = false, features = ["attributes"] }
miette = { version = "7.2", default-features = false, features = ["derive"] }
